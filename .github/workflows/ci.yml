name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # electron-builder's postinstall isn't needed for checks and slows CI down.
  ELECTRON_BUILDER_SKIP_REBUILD: '1'

jobs:
  checks:
    name: Typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Unit tests
        run: npm test

      - name: Build (main · preload · renderer)
        run: npm run build

  e2e:
    name: E2E smoke (${{ matrix.os }} ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sharded 3-way: the ubuntu (xvfb) run is CI's longest single step,
          # and the suite's 33 tests have no cross-test ordering or shared
          # state, so splitting them across jobs is safe.
          - os: ubuntu-latest
            shardIndex: 1
            shardTotal: 3
          - os: ubuntu-latest
            shardIndex: 2
            shardTotal: 3
          - os: ubuntu-latest
            shardIndex: 3
            shardTotal: 3
          # macOS runner-minutes bill at a much higher multiplier, and this
          # job isn't the critical path — left unsharded.
          - os: macos-latest
            shardIndex: 1
            shardTotal: 1
          # Windows has never run here, and nothing has ever been built or
          # shipped for it (143 releases, zero Windows assets), so this job
          # exists to find out what breaks rather than to gate anything yet.
          # `continue-on-error` is deliberate and TEMPORARY: a red job here
          # must not fail the CI workflow, because `release-continuous.yml`
          # triggers on CI success and would otherwise stop publishing the
          # macOS and Linux builds that do work. Flip it to blocking in the
          # same PR that turns on the Windows release build.
          - os: windows-latest
            shardIndex: 1
            shardTotal: 1
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (node-pty)
        run: npx electron-rebuild -f -w node-pty

      - name: Build
        run: npm run build

      # `scripts/__tests__/adhoc-sign-mac.test.ts` is `skipIf(platform !==
      # 'darwin')` — codesign exists nowhere else — so the ubuntu unit-test job
      # skips it and CI never ran it at all. That is how a signer that fails
      # its own verification merged green and killed every macOS release build
      # for a day (see docs/log/2026-09-03-adhoc-sign-nested-code.md). This is
      # the only macOS runner in CI; the suite takes well under a second.
      - name: Unit tests (macOS-only suites)
        if: runner.os == 'macOS'
        run: npx vitest run scripts/__tests__/adhoc-sign-mac.test.ts

      # The Electron window needs a display server on Linux runners.
      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # The full unit suite, not just the e2e run: the `checks` job is
      # ubuntu-only, so every path-handling and cwd-mangling test in
      # `pi-paths`, `claude-paths` and `session-writer` has only ever been
      # asserted against POSIX separators. Cheap (~10s) and the most likely
      # place a Windows-specific bug shows up first.
      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        # Non-fatal for the same reason the job is, and additionally so a unit
        # failure does not skip the e2e step below — the two answer different
        # questions and the first run needs both. Drop this once the
        # POSIX-only suites are platform-gated.
        continue-on-error: true
        run: npm test

      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
