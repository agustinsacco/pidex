  <path d="M286 288L404 286L474 322L318 324Z" fill="#ef4f42" stroke="#7d1a17" stroke-width="4"/>
  <path d="M330 292L318 320" stroke="#7d1a17" stroke-width="5" fill="none"/>
  <g stroke="#566070" stroke-width="8" fill="none">
