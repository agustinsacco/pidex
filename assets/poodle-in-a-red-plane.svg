<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="t2 d2">
  <title id="t2">Brown poodle flying a red plane</title>
  <desc id="d2">A curly brown poodle in aviator goggles peeks out of the cockpit of a small red aeroplane with a spinning propeller.</desc>

  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaff"/>
      <stop offset="1" stop-color="#f2f8ff"/>
    </linearGradient>
    <g id="poodleFluff">
      <circle cx="306" cy="212" r="24"/>
      <circle cx="336" cy="204" r="22"/>
      <circle cx="294" cy="222" r="16"/>
      <circle cx="358" cy="212" r="16"/>
    </g>
    <g id="poodleCurls">
      <circle cx="326" cy="168" r="30"/>
      <circle cx="304" cy="156" r="21"/>
      <circle cx="328" cy="140" r="23"/>
      <circle cx="352" cy="152" r="19"/>
      <circle cx="358" cy="174" r="16"/>
      <circle cx="298" cy="182" r="18"/>
    </g>
  </defs>

  <rect width="640" height="480" fill="url(#sky2)"/>

  <!-- sun -->
  <g fill="#ffd66b">
    <circle cx="566" cy="72" r="34"/>
    <g stroke="#ffd66b" stroke-width="7" stroke-linecap="round">
