    <circle cx="96" cy="126" r="26"/><circle cx="126" cy="114" r="22"/><circle cx="70" cy="136" r="18"/><circle cx="150" cy="132" r="16"/>
    <rect x="66" y="130" width="90" height="22" rx="11"/>
    <circle cx="470" cy="404" r="24"/><circle cx="500" cy="392" r="20"/><circle cx="446" cy="412" r="16"/>
    <rect x="442" y="406" width="76" height="20" rx="10"/>
  </g>

  <!-- speed lines -->
  <g stroke="#a8cbe6" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M28 236h74"/><path d="M12 262h86"/><path d="M36 288h66"/>
