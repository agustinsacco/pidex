  <!-- aeroplane -->
  <path d="M126 240C118 206 128 184 150 180C168 178 176 196 174 238Z" fill="#a92320" stroke="#7d1a17" stroke-width="3"/>
  <path d="M472 224C497 227 508 240 508 258C508 277 497 289 472 292L160 296C134 296 122 288 122 274L122 246C122 232 134 224 160 224Z" fill="#d9382e" stroke="#7d1a17" stroke-width="4"/>
  <path d="M130 262C220 258 360 254 500 260L502 274C360 268 220 272 130 276Z" fill="#fdfcf8" stroke="none"/>
  <path d="M110 250C142 240 174 242 198 248L198 262C172 258 142 260 110 268Z" fill="#c22f27" stroke="#7d1a17" stroke-width="3"/>

