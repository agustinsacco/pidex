  <path d="M338 150C358 158 362 188 348 206C338 218 324 212 326 196Z" fill="#7d5330" stroke="#4a2f19" stroke-width="3"/>
  <g fill="#2b2f36">
    <circle cx="338" cy="161" r="5"/><circle cx="367" cy="169" r="4.5"/>
  </g>
