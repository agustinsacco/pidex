      <rect x="256" y="360" width="36" height="9" rx="3"/>
    </g>
  </g>

  <!-- pelican: far leg, tail, beak, one-piece body, near leg -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 200C240 250 248 314 262 352" stroke="#e08e22" stroke-width="10"/>
    <path d="M250 350C272 352 290 360 288 370C276 378 256 374 246 364Z" fill="#e08e22" stroke="#c47616" stroke-width="3"/>

