<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Pelican riding a bicycle</title>
  <desc id="dsc">A white pelican with a big orange pouch pedals a blue bicycle, one wing on the handlebar.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f3ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>

    <g id="wheel">
      <circle r="70" fill="none" stroke="#2b2f36" stroke-width="11"/>
      <circle r="57" fill="none" stroke="#cfd6e0" stroke-width="5"/>
      <g stroke="#aab3c0" stroke-width="2">
        <line x1="-57" y1="0" x2="57" y2="0"/>
        <line x1="-49" y1="-29" x2="49" y2="29"/>
        <line x1="-29" y1="-49" x2="29" y2="49"/>
        <line x1="0" y1="-57" x2="0" y2="57"/>
        <line x1="29" y1="-49" x2="-29" y2="49"/>
        <line x1="49" y1="-29" x2="-49" y2="29"/>
      </g>
      <circle r="8" fill="#566070"/>
    </g>
  </defs>

  <rect width="640" height="480" fill="url(#sky)"/>
  <ellipse cx="315" cy="424" rx="215" ry="13" fill="#c9d6e6" opacity="0.55"/>
  <g stroke="#b6c6da" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M64 262h46"/><path d="M44 292h60"/><path d="M72 322h40"/>
  </g>

  <!-- bicycle -->
  <g fill="none" stroke-linecap="round">
    <use href="#wheel" x="180" y="340"/>
    <use href="#wheel" x="450" y="340"/>

    <g stroke="#6b7280" stroke-width="4">
      <path d="M193 329L300 328"/>
      <path d="M193 351L300 372"/>
    </g>
    <circle cx="180" cy="340" r="13" fill="#eef2f8" stroke="#7c879a" stroke-width="4"/>
    <circle cx="300" cy="350" r="22" fill="#eef2f8" stroke="#7c879a" stroke-width="4"/>

    <g stroke="#2f6fd0" stroke-width="10">
      <path d="M180 340L300 350"/>
      <path d="M180 340L270 236"/>
      <path d="M300 350L268 228"/>
      <path d="M300 350L416 224"/>
      <path d="M270 236L418 214"/>
      <path d="M412 204L424 240"/>
      <path d="M420 228L450 340"/>
      <path d="M268 228L262 212"/>
      <path d="M414 204C402 197 394 191 388 182"/>
